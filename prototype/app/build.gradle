plugins {
    id "com.android.application"
}

android {
    namespace "com.veyrix.tiktokplus.prototype"
    compileSdk 35

    defaultConfig {
        applicationId "com.veyrix.tiktokplus.prototype"
        minSdk 23
        targetSdk 35
        versionCode (providers.gradleProperty("appVersionCode").orElse("2").get()).toInteger()
        versionName providers.gradleProperty("appVersionName").orElse("0.2.0").get()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
