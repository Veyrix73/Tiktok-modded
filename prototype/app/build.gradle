plugins {
    id "com.android.application"
}

android {
    namespace "com.veyrix.tiktokplus.prototype"
    compileSdk 35

    defaultConfig {
        applicationId "com.veyrix.tiktokplus.prototype"
        minSdk 23
        targetSdk 35
        versionCode providers.gradleProperty("appVersionCode").getOrElse("200").toInteger()
        versionName providers.gradleProperty("appVersionName").getOrElse("0.2.0")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
