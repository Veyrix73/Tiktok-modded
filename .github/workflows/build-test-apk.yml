name: Build TikTok+ test APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-test-apk.yml"
      - "scripts/brand_apk.py"
      - "tiktok-47-9-3.zip"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiktokplus-test-apk
  cancel-in-progress: false

jobs:
  build:
    name: Decode, brand, rebuild and sign
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository and download the LFS APK archive
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify original APK archive
        shell: bash
        run: |
          set -euo pipefail
          test -s tiktok-47-9-3.zip
          echo "0f37ee640ff4dc340bd59d755aa7f538c5e15cdf3a215893d1afdaa41bbb1b95  tiktok-47-9-3.zip" | sha256sum --check
          unzip -tq tiktok-47-9-3.zip
          mkdir -p work dist

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android build tools
        uses: android-actions/setup-android@v3

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          apktool --version
          sdkmanager "build-tools;35.0.0"

      - name: Decode the original package
        shell: bash
        run: |
          set -euo pipefail
          apktool d -f -o work/decoded tiktok-47-9-3.zip

      - name: Apply TikTok+ test branding
        run: python3 scripts/brand_apk.py work/decoded

      - name: Rebuild APK
        shell: bash
        run: |
          set -euo pipefail
          apktool b work/decoded --use-aapt2 -o dist/test-Tiktok-plus-unsigned.apk
          test -s dist/test-Tiktok-plus-unsigned.apk
          unzip -tq dist/test-Tiktok-plus-unsigned.apk

      - name: Create temporary test signing key
        shell: bash
        run: |
          set -euo pipefail
          echo "TEST_KEYSTORE_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt             -keystore dist/test-signing.keystore             -storepass "$TEST_KEYSTORE_PASSWORD"             -keypass "$TEST_KEYSTORE_PASSWORD"             -alias tiktokplus-test             -keyalg RSA -keysize 2048 -validity 3650             -dname "CN=TikTok Plus Test, OU=Test Build, O=Veyrix73, L=Riga, ST=LV, C=LV"

      - name: Align and sign test APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4             dist/test-Tiktok-plus-unsigned.apk             dist/test-Tiktok-plus-aligned.apk
          "$BUILD_TOOLS/apksigner" sign             --ks dist/test-signing.keystore             --ks-key-alias tiktokplus-test             --ks-pass env:TEST_KEYSTORE_PASSWORD             --key-pass env:TEST_KEYSTORE_PASSWORD             --out "dist/test-Tiktok+.apk"             dist/test-Tiktok-plus-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "dist/test-Tiktok+.apk"
          "$BUILD_TOOLS/aapt" dump badging "dist/test-Tiktok+.apk" | tee dist/apk-badging.txt
          grep -F "package: name='com.veyrix.tiktokplus.test'" dist/apk-badging.txt
          grep -F "application-label:'TikTok+ Test'" dist/apk-badging.txt
          sha256sum "dist/test-Tiktok+.apk" | tee dist/SHA256SUMS.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-Tiktok-plus-apk
          path: |
            dist/test-Tiktok+.apk
            dist/apk-badging.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
